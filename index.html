<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D1C1A">
<title>Gymtracker</title>
<script>
/* Theme setzen, bevor das Stylesheet greift, sonst blitzt beim Start kurz das
   Standard-Theme auf. Eigener, winziger Schlüssel: den kompletten Datensatz
   hier zu parsen würde den Start bremsen. app.js hält ihn synchron. */
(function () {
  try {
    var t = localStorage.getItem('gym.theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) { /* privater Modus o.ä.: dann bleibt es beim Standard */ }
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<!-- crossorigin ist Pflicht, sonst lädt der Browser die Schriften doppelt -->
<link rel="preload" href="fonts/archivo-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/big-shoulders-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn hidden" id="btnBack" aria-label="Zurück">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <div class="grow">
    <h1 id="viewTitle">Heute</h1>
    <div class="top-sub" id="topSub"></div>
  </div>
  <button class="icon-btn hidden" id="btnNew" aria-label="Neue Übung">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
  </button>
</header>

<main id="main">
  <section class="view" id="view-heute"></section>
  <section class="view hidden" id="view-verlauf"></section>
  <section class="view hidden" id="view-uebungen"></section>
  <!-- Unterseite: über die Übungsliste erreichbar, kein eigener Tab -->
  <section class="view hidden" id="view-uebung"></section>
  <section class="view hidden" id="view-einst"></section>
</main>

<!-- Pausentimer: feste Leiste über der unteren Leiste, nur während einer Pause -->
<div class="restbar hidden" id="restbar" role="status" aria-live="off"></div>

<!-- Icons: Lucide (ISC-Lizenz, licenses/lucide-ISC.txt) -->
<nav class="tabbar" id="tabbar">
  <button data-nav="heute" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.596 12.768a2 2 0 1 0 2.829-2.829l-1.768-1.767a2 2 0 0 0 2.828-2.829l-2.828-2.828a2 2 0 0 0-2.829 2.828l-1.767-1.768a2 2 0 1 0-2.829 2.829z"/><path d="m2.5 21.5 1.4-1.4"/><path d="m20.1 3.9 1.4-1.4"/><path d="M5.343 21.485a2 2 0 1 0 2.829-2.828l1.767 1.768a2 2 0 1 0 2.829-2.829l-6.364-6.364a2 2 0 1 0-2.829 2.829l1.768 1.767a2 2 0 0 0-2.828 2.829z"/><path d="m9.6 14.4 4.8-4.8"/></svg><span>Heute</span></button>
  <button data-nav="verlauf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg><span>Verlauf</span></button>
  <button data-nav="uebungen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg><span>Übungen</span></button>
  <button data-nav="einst"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg><span>Mehr</span></button>
</nav>

<!-- Sheet: trägt alle Formulare und Dialoge -->
<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="link" id="sheetCancel">Abbrechen</button>
    <strong id="sheetTitle"></strong>
    <button class="link strong" id="sheetSave">Sichern</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
